# Omni's continuous integration — the two suites the project runs locally, on every push.
#
#  1. **JVM unit tests** (`:app:testDebugUnitTest`) — the domain logic (insights, health report,
#     directory selection, motion contracts) that is deliberately pure enough to run on a JVM
#     without an emulator.
#  2. **Firestore security rules** (`tools/rules.test.mjs`) — every rule in `firestore.rules`
#     asserted against the real Firebase emulator, because a rule that denies the app is exactly
#     the kind of failure that hides as "the feature is broken" on a device (it did: the pharmacy
#     directory shipped before its rules did).
#
# Neither job needs an Android emulator or any secret: the gradle test task compiles the app, and
# the rules suite runs against `demo-omni`, the throwaway project the emulator fakes. `concurrency`
# cancels superseded runs on the same branch so rapid pushes don't queue behind stale ones.

name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools dependencies
        run: npm install

      - name: Run rules tests against the emulator
        run: npx firebase-tools emulators:exec --only firestore --project demo-omni "node --test rules.test.mjs"
